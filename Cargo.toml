[package]
name = "stacsos-rs"
version = "0.1.0"
edition = "2024"
authors = ["Tom Harper <tgh1@st-andrews.ac.uk>"]

[package.metadata.bootimage]
run-command = [
    "/usr/local/qemu/bin/qemu-system-x86_64",
    "-drive",
    "format=raw,file={}",
]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none",
]
test-timeout = 60
test-success-exit-code = 33  # (0x10 << 1) | 1

[dependencies]
bootloader = { version = "=0.9", features = ["map_physical_memory"] }
linked_list_allocator = "0.9.0"
pc-keyboard = "0.7.0"
pic8259 = "0.10.1"
spin = "0.5.2"
uart_16550 = "0.2.0"
volatile = "0.2.6"
x86_64 = "0.14.2"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[test]]
name = "should_panic"
harness = false # The test runner is not needed because there is only a single test case

[[test]]
name = "stack_overflow"
harness = false
