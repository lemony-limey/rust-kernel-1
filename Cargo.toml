[package]
name = "stacsos-rs"
version = "0.1.0"
edition = "2024"
authors = ["Tom Harper <tgh1@st-andrews.ac.uk>"]
publish = false  # This crate should never be published to crates.io
build = "build.rs"

[dependencies]
# Used for UEFI booting in QEMU
ovmf-prebuilt = "0.2.3"

[build-dependencies]
bootloader = "0.11"
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }

[workspace]
members = ["kernel"]
resolver = "3"
